<title>MUDANÇA TOTAL 2.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* FÊNIX BRILHANDO E PISCANDO */
@keyframes brilho{
0%{filter:brightness(1) drop-shadow(0 0 10px gold) drop-shadow(0 0 20px orange); transform:scale(1)}
50%{filter:brightness(1.5) drop-shadow(0 0 30px gold) drop-shadow(0 0 60px orange) drop-shadow(0 0 90px red); transform:scale(1.03)}
100%{filter:brightness(1) drop-shadow(0 0 10px gold) drop-shadow(0 0 20px orange); transform:scale(1)}
}
.fenix{animation:brilho 2.5s infinite ease-in-out; will-change:filter,transform}

/* BOTÃO PULSANDO */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,106,.8)}70%{box-shadow:0 0 0 25px rgba(201,168,106,0)}100%{box-shadow:0 0 0 0 rgba(201,168,106,0)}}
.pulse{animation:pulse 2s infinite}
</style>
</head>
