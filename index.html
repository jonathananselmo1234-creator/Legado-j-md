<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGADO J</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@900&family=Inter:wght@900&display=swap');
.gold {
  font-family: 'Cinzel Decorative', 'Cinzel', serif;
  background: linear-gradient(180deg, #FFF4B5 0%, #FFD700 25%, #C9A86A 50%, #8C6B3A 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,215,0,0.6)) drop-shadow(0 0 50px rgba(201,168,106,0.8)) drop-shadow(0 4px 0 #000);
  letter-spacing: 0.05em;
}
.frase-preta{
  font-family: 'Inter', sans-serif;
  background: rgba(255,255,255,0.92);
  color: #000;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
@keyframes pisca{0%,100%{filter:brightness(1) drop-shadow(0 0 15px gold)}50%{filter:brightness(1.7) drop-shadow(0 0 45px gold)}}
.fenix{animation:pisca 2.5s infinite}
</style>
</head>
<body class="bg-black">
<div class="w-full h-[100svh] relative bg-black flex items-center justify-center overflow-hidden">
<img src="./IMG-20261012-WA6332.jpg" class="fenix w-full h-full object-cover absolute inset-0 scale-[1.5] object-[center_40%]">

<!-- TAMPA TUDO QUE VEM ESCRITO DENTRO DA FOTO -->
<div class="absolute top-0 left-0 right-0 h-[28%] bg-black z-10"></div>
<div class="absolute bottom-0 left-0 right-0 h-[35%] bg-black z-10"></div>
<div class="absolute inset-0 bg-black/10 z-[5]"></div>

<div class="relative z-20 text-center px-4">
<h1 class="gold font-black leading-[0.85] text-[22vw] md:text-[130px]">LEGADO<br>J</h1>

<!-- FRASE NOVA ABAIXO DO LEGADO J -->
<p class="frase-preta mt-6 inline-block px-5 py-2 rounded-full font-black tracking-wide text-[11px] md:text-[14px] uppercase">
Se você for capaz de vencer você mesmo, você vence qualquer coisa.
</p>
</div>
</div>
</body>
</html>
