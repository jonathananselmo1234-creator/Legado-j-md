<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
body{font-family:'Inter',sans-serif}
@keyframes brilho-pisca{
0%{opacity:1;filter:brightness(1) drop-shadow(0 0 15px gold) drop-shadow(0 0 30px orange);transform:scale(1)}
25%{opacity:0.7;filter:brightness(1.8) drop-shadow(0 0 40px gold) drop-shadow(0 0 80px orange) drop-shadow(0 0 120px red);transform:scale(1.02)}
50%{opacity:1;filter:brightness(1.1) drop-shadow(0 0 20px gold);transform:scale(1)}
75%{opacity:0.6;filter:brightness(2.1) drop-shadow(0 0 50px gold) drop-shadow(0 0 90px orange);transform:scale(1.04)}
100%{opacity:1;filter:brightness(1) drop-shadow(0 0 15px gold);transform:scale(1)}
}
.fenix{animation:brilho-pisca 2s infinite ease-in-out;will-change:filter,transform}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,106,.8)}70%{box-shadow:0 0 0 25px rgba(201,168,106,0)}100%{box-shadow:0 0 0 0 rgba(201,168,106,0)}}
.pulse{animation:pulse 2s infinite}
</style>
